name: Update XSMB data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest 100 Northern lottery draws
        run: |
          curl --fail --silent --show-error --location \
            "https://api.xosovnm.net/api/lottery/region/mien-bac?limit=100" \
            --output data.json
          jq -e '.data | type == "array" and length > 0' data.json >/dev/null

      - name: Commit updated data when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update XSMB results data"
            git push
          fi
